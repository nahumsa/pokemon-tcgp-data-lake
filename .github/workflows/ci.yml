name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  logic-ci:
    name: Logic CI
    runs-on: ubuntu-latest
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checks without saved datasets
        run: |
          rm -rf data/limitless_labs
          rm -f pokemon_tcg_pipeline.duckdb semantic_layer/pokemon_tcg_pipeline.duckdb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Install dbt packages
        run: |
          cd transformations
          uv run dbt deps

      - name: Validate dbt project configuration
        run: |
          cd transformations
          uv run dbt parse --profiles-dir . --no-partial-parse

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Test ingestion logic
        run: uv run pytest ingestion/test_labs.py -q

      - name: Test modeling logic with synthetic inputs
        run: uv run pytest tests/test_modeling_regressions.py -q
