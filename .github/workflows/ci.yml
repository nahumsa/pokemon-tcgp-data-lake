name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  logic-ci:
    name: Logic CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Configure isolated runtime paths
        shell: bash
        run: echo "DATA_DIR=$RUNNER_TEMP/pokemon-tcg-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: make setup

      - name: Run shared logic checks
        run: make check

      - name: Verify checks created no pipeline database
        shell: bash
        run: |
          test ! -e "$DATA_DIR/pokemon_tcg_pipeline.duckdb"
