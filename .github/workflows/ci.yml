name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  logic-ci:
    name: Logic CI
    runs-on: ubuntu-latest
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checks without saved datasets
        run: |
          rm -f pokemon_tcg_pipeline.duckdb semantic_layer/pokemon_tcg_pipeline.duckdb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Validate definitions and analysis process
        run: uv run python scripts/validate.py --analysis docs/analysis_example.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: validation-results/
