version: 2

models:
  - name: dim_cards
    description: "Dimension table containing unique card information extracted from decklists."
    columns:
      - name: card_id
        description: "Unique surrogate key for the card."
        tests:
          - unique
          - not_null
      - name: card_name
        description: "Name of the card."
        tests:
          - not_null
      - name: card_code
        description: "Set code and number of the card (e.g., SVI-001)."
      - name: card_kind
        description: "Type of card (pokemon, trainer, energy)."
        tests:
          - accepted_values:
              arguments:
                values: ["pokemon", "trainer", "energy"]

  - name: dim_participants
    description: "Dimension table containing tournament participants."
    columns:
      - name: participant_id
        description: "Unique surrogate key for the participant."
        tests:
          - unique
          - not_null
      - name: tournament_id
        description: "Foreign key linking to the tournament."
        tests:
          - relationships:
              arguments:
                to: ref('dim_tournaments')
                field: tournament_id
              config:
                severity: warn
      - name: player_name
        description: "Name of the player."
        tests:
          - not_null
      - name: tournament_url
        description: "URL of the tournament standings page."
      - name: decklist_link
        description: "URL to the player's specific decklist."

  - name: dim_tournaments
    description: "Dimension table containing tournament details."
    columns:
      - name: source
        description: "Data provider, independent of the event setting."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["limitless_play", "limitless_labs", "unknown"]
      - name: event_type
        description: "Event setting. Explicit ingestion metadata overrides legacy URL defaults."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["online", "in_person", "unknown"]
      - name: tournament_id
        description: "Unique surrogate key for the tournament."
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the tournament."
      - name: date
        description: "Date when the tournament was held."
      - name: format
        description: "Tournament format (e.g., Standard)."
      - name: players
        description: "Number of players in the tournament."
      - name: winner
        description: "Name of the tournament winner."

  - name: dim_deck_archetypes
    description: "Classified archetypes for participant decks based on key cards."
    columns:
      - name: participant_id
        description: "Unique surrogate key for the participant."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_participants')
                field: participant_id
      - name: archetype
        description: "Primary archetype of the deck (e.g., Dragapult, Charizard)."
        tests:
          - not_null
      - name: sub_archetype
        description: "Specific variant of the archetype (e.g., Dragapult Dusknoir)."
        tests:
          - not_null

  - name: fct_deck_composition
    description: "Fact table detailing the cards included in each participant's deck."
    columns:
      - name: participant_id
        description: "Foreign key to the participant."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_participants')
                field: participant_id
      - name: card_name
        description: "Name of the card included."
        tests:
          - not_null
      - name: quantity
        description: "Number of copies of the card in the deck."
        tests:
          - not_null

  - name: fct_matches
    description: "Player-perspective result records; preserve for player and archetype metrics, not physical-match totals."
    columns:
      - name: match_id
        description: "Unique surrogate key for a player/event/raw-round record, not a unique played match."
        tests:
          - unique
          - not_null
      - name: participant_id
        description: "Foreign key to the participant (Player 1)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_participants')
                field: participant_id
      - name: tournament_id
        description: "Foreign key to the tournament."
        tests:
          - relationships:
              arguments:
                to: ref('dim_tournaments')
                field: tournament_id
              config:
                severity: warn
      - name: round
        description: "Round number of the match."
      - name: opponent_name
        description: "Name of the opponent."
      - name: result
        description: "Outcome of the match for the participant."
        tests:
          - accepted_values:
              arguments:
                values: ["WIN", "LOSS", "TIE"]

  - name: dim_pokemon_sets
    description: "Dimension table containing Pokémon TCG expansion sets and their legality dates."
    columns:
      - name: set_name
        description: "Full name of the expansion set."
        tests:
          - not_null
      - name: set_abbreviation
        description: "Standard abbreviation code for the set (e.g., SVI)."
        tests:
          - unique
          - not_null
      - name: release_date
        description: "Official release date of the set."
        tests:
          - not_null
      - name: online_start_date
        description: "Date when the set becomes legal for online tournament play (Release Date - 1 day)."
        tests:
          - not_null

  - name: fct_tournament_matches
    description: "Observed played pairings and unresolved record groups; source histories may be incomplete."
    columns:
      - name: match_group_id
        description: "Unique reconciliation group. Conflicting candidate pairs keep their pair key; other unresolved records and byes use a source-record fallback."
      - name: canonical_match_id
        description: "Canonical event/round/player-pair ID, null for byes and unresolved pairings."
      - name: resolution_reason
        description: "Reason a pairing is resolved or excluded from unique played matches."
      - name: history_status
        description: "Whether histories are mirrored, one-sided, a bye, or unresolved."
      - name: outcome_status
        description: "Consistency of the recorded results, independent of pairing identity."
      - name: perspective_record_ids
        description: "Contributing fct_matches.match_id values for provenance and drilldown."
      - name: perspective_record_count
        description: "Number of contributing player-perspective records."
      - name: duplicate_perspective_record_count
        description: "Extra records per player in the reconciliation group."

  - name: dim_deck_classification
    description: "Classification coverage and rule provenance for every imported participant. See docs/archetype_classification.md."
    columns:
      - name: participant_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_participants')
                field: participant_id
      - name: classification_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [matched, ambiguous, unmatched, missing_decklist, source_label_mapped, source_label_unmapped, source_label_ambiguous]
      - name: ruleset_version
        tests:
          - not_null
      - name: selected_rule_id
        tests:
          - relationships:
              arguments:
                to: ref('meta_decks')
                field: rule_id
