- name: conflicting_pairings_include_inferred_reverse_edges
  model: fct_tournament_matches
  given:
  - input: ref('fct_matches')
    format: sql
    rows: |
      select * from (values
          ('ab', 't1', 'a', 'b', '1', 'Bob', 'WIN'),
          ('bc', 't1', 'b', 'c', '1', 'Bob', 'LOSS'),
          ('de', 't1', 'd', 'e', '1', 'Bob', 'WIN')
      ) as m(match_id, tournament_id, participant_id, opponent_id, round, opponent_name, result)
  - input: ref('dim_participants')
    format: sql
    fixture: match_participants
  expect:
    rows:
    - match_group_id: match:130f377c8c806484d6193bc7c53f802f
      canonical_match_id: null
      resolution_reason: conflicting_pairing
      history_status: unresolved
      perspective_record_count: 1
    - match_group_id: match:70372bf0c64911977383be60d2e57bbd
      canonical_match_id: null
      resolution_reason: conflicting_pairing
      history_status: unresolved
      perspective_record_count: 1
    - match_group_id: match:484c4d0ae96d9470f5d1f690d7ec4f52
      canonical_match_id: match:484c4d0ae96d9470f5d1f690d7ec4f52
      resolution_reason: resolved
      history_status: one_sided
      perspective_record_count: 1
- name: empty_histories_do_not_invent_matches
  model: fct_tournament_matches
  given:
  - input: ref('fct_matches')
    format: sql
    rows: |
      select null::varchar as match_id, null::varchar as tournament_id, null::varchar as participant_id, null::varchar as opponent_id, null::varchar as round, null::varchar as opponent_name, null::varchar as result
      where false
  - input: ref('dim_participants')
    format: sql
    fixture: match_participants
  expect:
    rows: []
