    rows: |
      select * from (values ('d4622368ed095a92180bc3734888d4df'), ('762e5b0d392243d930b28501d71fadce')) p(participant_id)
  - input: ref('fct_deck_composition')
    format: sql
    rows: |
      select null::varchar as participant_id, null::varchar as card_name where false
  - input: source('pokemon_tcg', 'tournament_participants')
