# Production SQL with isolated fixtures; no saved databases are required.
unit_tests:
- name: archetype_priority_overrides_alphabetical_order
  model: dim_deck_classification
  given:
  - input: ref('meta_decks')
    format: sql
    rows: "select * from (values\n  ('r-a', 0, 'Key', null::varchar, 'Alpha', 'Alpha'),\n  ('r-z', 10, 'Key', null::varchar,\
      \ 'Zulu', 'Zulu')\n) m(rule_id, rule_priority, card_name_1, card_name_2, archetype, sub_archetype)\n"
  - input: ref('fct_deck_composition')
    format: sql
    rows: 'select ''p1'' as participant_id, ''Key'' as card_name

      '
  - input: source('pokemon_tcg', 'tournament_participants')
    format: sql
    rows: "select null::varchar as name, null::varchar as tournament_link,\n  null::varchar as deck, null::varchar\
      \ as _dlt_load_id where false\n"
  - input: ref('dim_participants')
    format: sql
    rows: select 'p1' as participant_id
  expect:
    rows:
    - participant_id: p1
      archetype: Zulu
      sub_archetype: Zulu
