version: 2
models:
- name: mart_archetype_stats
  description: Overall performance statistics aggregated by deck archetype and sub-archetype.
  columns:
  - name: archetype
    description: Primary deck archetype.
    tests:
    - not_null
  - name: total_matches
    description: Total number of matches played by this archetype.
  - name: wins
    description: Total wins.
  - name: win_rate
    description: Win rate percentage (0-100).
  - name: source
    tests:
    - not_null
  - name: event_type
    tests:
    - not_null
- name: mart_archetype_matchups
  description: Head-to-head performance matrix between different archetypes.
  columns:
  - name: p1_archetype
    description: Archetype of the primary player.
    tests:
    - not_null
  - name: p2_archetype
    description: Archetype of the opponent.
    tests:
    - not_null
  - name: total_matches
    description: Number of matches recorded for this specific matchup.
  - name: win_no_ties_rate
    description: Wins / recorded player-results as a percentage (0-100); ties remain in the denominator.
  - name: win_ties_rate
    description: (Wins + ties) / recorded player-results as a percentage (0-100).
  - name: source
    tests:
    - not_null
  - name: event_type
    tests:
    - not_null
- name: mart_cards_used
  description: Aggregation of card usage across all tournament decks.
  columns:
  - name: card_name
    description: Name of the card.
    tests:
    - not_null
  - name: total_used
    description: Cumulative count of this card across all decks.
  - name: decks_containing
    description: Number of unique decks that included at least one copy of this card.
  - name: source
    tests:
    - not_null
  - name: event_type
    tests:
    - not_null
- name: mart_deck_analysis
  description: Detailed performance analysis for each participant and their deck.
  columns:
  - name: player_name
    description: Name of the player.
    tests:
    - not_null
  - name: tournament_url
    description: Link to the tournament standings.
  - name: win_rate
    description: Wins / recorded player-results as a percentage (0-100), including ties in the denominator; null without results.
- name: mart_tournament_analysis
  description: Tournament summary with observed unique pairings, player-record counts, and reconciliation coverage.
  columns:
  - name: tournament_id
    description: Unique identifier for the tournament.
    tests:
    - unique
    - not_null
  - name: tournament_name
    description: Official name of the tournament.
  - name: player_count
    description: Total number of participants recorded.
  - name: total_matches
    description: Deprecated compatibility alias for perspective_record_count; not a unique-match total.
  - name: perspective_record_count
    description: Player-result records including byes and unresolved records.
  - name: unique_match_count
    description: Observed played pairings with reliable identities; excludes byes and unresolved pairings, not an event completeness guarantee.
  - name: mirrored_match_count
    description: Identified pairings with records for both players.
  - name: one_sided_match_count
    description: Identified pairings with a record for only one known player.
  - name: bye_record_count
    description: Explicit BYE records, not played matches.
  - name: unresolved_perspective_record_count
    description: Player records excluded from unique match counts because their pairing or round is unresolved.
  - name: conflicting_outcome_match_count
    description: Identified pairings with conflicting outcomes; still included in unique_match_count.
  - name: incomplete_outcome_match_count
    description: Identified pairings with missing/unrecognized outcomes; still included in unique_match_count.
- name: mart_monthly_meta_shifts
  description: Monthly aggregation of deck archetype popularity and performance.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - tournament_month
        - source
        - event_type
        - archetype
  columns:
  - name: tournament_month
    description: The month of the tournaments.
    tests:
    - not_null
  - name: archetype
    description: Deck archetype.
    tests:
    - not_null
  - name: meta_share
    description: Percentage of participants using this archetype in the given month.
  - name: source
    tests:
    - not_null
  - name: event_type
    tests:
    - not_null
- name: mart_archetype_card_staples
  description: Analysis of card inclusion rates and average quantities within each deck archetype.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - set_name
        - source
        - event_type
        - archetype
        - card_name
        - card_kind
  columns:
  - name: archetype
    description: Deck archetype.
    tests:
    - not_null
  - name: card_name
    description: Name of the card.
    tests:
    - not_null
  - name: inclusion_rate
    description: Percentage of decks in this archetype that include the card.
  - name: source
    tests:
    - not_null
  - name: event_type
    tests:
    - not_null
- name: mart_player_lifetime_stats
  description: Aggregated lifetime performance and favorite archetypes for all players.
  columns:
  - name: player_name
    description: Name of the player.
    tests:
    - not_null
    - unique
  - name: win_rate
    description: Overall win rate across all matches.
- name: mart_archetype_matchup_suggestions
  description: Observed card associations with both comparison groups, published-list coverage and explicit sample thresholds; not causal effects or optimized quantities.
  columns:
  - name: set_name
    tests: [not_null]
  - name: game
    description: Current supported importer scope, Pokemon TCG only.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [PTCG]
  - name: format
    tests: [not_null]
  - name: archetype
    tests: [not_null]
  - name: opponent_archetype
    tests: [not_null]
  - name: suggested_card
    description: Legacy name for the observed card; not a recommendation.
    tests: [not_null]
  - name: evidence_status
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [missing_comparison_group, insufficient_matches, insufficient_decks, meets_sample_thresholds]
  - name: association_rank
    description: Within-cohort descriptive rank; null until both comparison groups meet sample thresholds.
  - name: sample_size
    description: With-card valid player-result observations, including draws.
  - name: matches_without_card
    description: Without-card valid player-result observations from published own lists only.
  - name: decks_with_card
    description: Distinct with-card tournament entries, not independent pilots.
  - name: decks_without_card
    description: Distinct without-card tournament entries.
  - name: decklist_match_coverage
    description: Covered results / valid classified matchup results, as a percentage; repeated per card.
  - name: suggested_quantity
    description: Legacy descriptive quantity from observed lists, weighted once per win; not an optimized prescription.
  - name: source
    tests: [not_null]
  - name: event_type
    tests: [not_null]
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns: [game, format, set_name, source, event_type, archetype, opponent_archetype, suggested_card]
  - dbt_utils.expression_is_true:
      arguments:
        expression: sample_size + matches_without_card = matches_with_decklists
  - dbt_utils.expression_is_true:
      arguments:
        expression: wins_with_card + losses_with_card + ties_with_card = sample_size
  - dbt_utils.expression_is_true:
      arguments:
        expression: wins_without_card + losses_without_card + ties_without_card = matches_without_card
  - dbt_utils.expression_is_true:
      arguments:
        expression: (association_rank is not null) = (evidence_status = 'meets_sample_thresholds')
  - dbt_utils.expression_is_true:
      arguments:
        expression: decklist_match_coverage between 0 and 100
- name: mart_monthly_populations
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - tournament_month
        - source
        - event_type
- name: mart_archetype_deck_populations
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - set_name
        - source
        - event_type
        - archetype
