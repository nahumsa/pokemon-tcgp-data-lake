archetype_stats:
  table: mart_archetype_stats
  database: main_consumption
  description: Performance statistics aggregated by deck archetype and set/meta period. Use this to find top current meta
    decks.
  dimensions:
    set_name:
      expr: _.set_name
      description: The card set or meta period.
    archetype:
      expr: _.archetype
      description: Primary deck archetype.
    sub_archetype:
      expr: _.sub_archetype
      description: Specific variant of the archetype.
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
  measures:
    total_matches:
      expr: _.total_matches.sum()
      description: Total number of matches played by this archetype.
    total_wins:
      expr: _.wins.sum()
      description: Total wins.
    total_losses:
      expr: _.losses.sum()
      description: Total losses.
    total_ties:
      expr: _.ties.sum()
      description: Total ties.
    avg_win_rate:
      expr: _.wins.sum() * 100.0 / _.total_matches.sum().nullif(0)
      description: Pooled wins / recorded player-results, as a percentage (0-100); ties stay in the denominator. Null with no results.
monthly_meta_shifts:
  table: mart_monthly_meta_shifts
  database: main_consumption
  description: Monthly archetype popularity and performance. Use this to understand the current meta and how it is changing
    over time.
  dimensions:
    tournament_month:
      expr: _.tournament_month
      description: Month of the tournaments.
    archetype:
      expr: _.archetype
      description: Deck archetype.
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
    meta_share:
      expr: _.meta_share
      description: Per-month/source/setting/archetype percentage; display at that grain, do not sum or average.
  measures:
    archetype_participants:
      expr: _.archetype_participants.sum()
      description: Number of players using this archetype.
    total_matches:
      expr: _.total_matches.sum()
      description: Total matches played by this archetype in the month.
    total_wins:
      expr: _.wins.sum()
      description: Total wins by this archetype in the month.
    avg_win_rate:
      expr: _.wins.sum() * 100.0 / _.total_matches.sum().nullif(0)
      description: Pooled wins / recorded player-results, as a percentage (0-100); ties stay in the denominator. Null with no results.
archetype_matchups:
  table: mart_archetype_matchups
  database: main_consumption
  description: Head-to-head performance matrix. Use this to find counters, favorable matchups, and difficult matchups.
  dimensions:
    set_name:
      expr: _.set_name
      description: The set or meta period.
    p1_archetype:
      expr: _.p1_archetype
      description: Primary player's archetype, the one whose win rate is being evaluated.
    p1_sub_archetype:
      expr: _.p1_sub_archetype
      description: Primary player's archetype variant.
    p2_archetype:
      expr: _.p2_archetype
      description: Opponent archetype.
    p2_sub_archetype:
      expr: _.p2_sub_archetype
      description: Opponent archetype variant.
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
  measures:
    total_matches:
      expr: _.total_matches.sum()
      description: Number of matches recorded for this matchup.
    total_wins:
      expr: _.wins.sum()
      description: Wins for the primary player's archetype.
    total_losses:
      expr: _.losses.sum()
      description: Losses for the primary player's archetype.
    total_ties:
      expr: _.ties.sum()
      description: Ties for the primary player's archetype.
    win_ties_rate:
      expr: (_.wins.sum() + _.ties.sum()) * 100.0 / _.total_matches.sum().nullif(0)
      description: Pooled (wins + ties) / recorded player-results, as a percentage (0-100). Null with no results.
    win_no_ties_rate:
      expr: _.wins.sum() * 100.0 / _.total_matches.sum().nullif(0)
      description: Pooled wins / recorded player-results, as a percentage (0-100); ties stay in the denominator. Null with no results.
cards_used:
  table: int_classified_deck_cards
  database: main_semantic
  description: Global card usage across tournament decks. Use this to find the most popular cards in the meta.
  dimensions:
    set_name:
      expr: _.set_name
      description: The set or meta period.
    card_name:
      expr: _.card_name
      description: Name of the card.
    card_code:
      expr: _.card_code
      description: Set code and number of the card.
    card_kind:
      expr: _.card_kind
      description: 'Type of card: pokemon, trainer, or energy.'
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
  measures:
    total_used:
      expr: _.quantity.sum()
      description: Total copies of this card across all decks.
    decks_containing:
      expr: _.participant_id.nunique()
      description: Number of decks containing at least one copy of this card.
card_staples:
  table: mart_archetype_card_staples
  database: main_consumption
  description: Card inclusion rates and average quantities within each deck archetype. Use this to understand staple cards
    for a deck.
  dimensions:
    archetype:
      expr: _.archetype
      description: Deck archetype.
    card_name:
      expr: _.card_name
      description: Name of the card.
    card_kind:
      expr: _.card_kind
      description: 'Type of card: pokemon, trainer, or energy.'
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
    set_name:
      expr: _.set_name
      description: Existing set/meta period assignment.
    inclusion_rate:
      expr: _.inclusion_rate
      description: Percentage for this functional card and archetype within one set/source/setting cohort.
  measures:
    decks_with_card:
      expr: _.decks_with_card.sum()
      description: Deck-card memberships; group or filter to one card for a deck count.
    avg_mean_quantity:
      expr: _.total_quantity_when_included.sum() * 1.0 / _.decks_with_card.sum().nullif(0)
      description: Weighted copies per included functional-card/deck observation.
matchup_suggestions:
  table: mart_archetype_matchup_suggestions
  database: main_consumption
  description: >-
    Observational card associations within compatible TCG game/format/period/archetype/source/setting cohorts.
    Compare with-card and without-card outcomes, deck samples and coverage. Filter evidence_status to
    meets_sample_thresholds before using association_rank; sample thresholds are not statistical significance.
    Pilot strength, deck variants, event selection and correlated card choices can explain differences.
    These results do not establish that adding a card changes matchup performance.
  dimensions:
    game:
      expr: _.game
      description: "Supported importer game, currently PTCG only; this model does not provide Pocket comparisons."
    format:
      expr: _.format
      description: "Recorded tournament format. Filter one compatible game/format/period cohort before interpreting rates."
    set_name:
      expr: _.set_name
      description: "Existing set/meta period assignment, not a new legality calendar."
    archetype:
      expr: _.archetype
      description: "Primary archetype in the observed comparison."
    opponent_archetype:
      expr: _.opponent_archetype
      description: "Opposing archetype in the observed comparison."
    suggested_card:
      expr: _.suggested_card
      description: "Legacy field name for the observed card; inclusion is not a recommendation to add it."
    card_kind:
      expr: _.card_kind
      description: "Recorded card type."
    source:
      expr: _.source
      description: "Tournament data provider."
    event_type:
      expr: _.event_type
      description: "Tournament setting: online, in_person, or unknown."
    evidence_status:
      expr: _.evidence_status
      description: "missing_comparison_group, insufficient_matches, insufficient_decks, or meets_sample_thresholds. Thresholds do not establish significance or causality."
    min_matches_per_group:
      expr: _.min_matches_per_group
      description: "Configured minimum recorded results in each comparison group."
    min_decks_per_group:
      expr: _.min_decks_per_group
      description: "Configured minimum distinct tournament entries in each group; not independent player identities."
    decklist_match_coverage:
      expr: _.decklist_match_coverage
      description: "Percentage of valid classified matchup results with published own-card rows; display at the full cohort/card grain."
    association_rank:
      expr: _.association_rank
      description: "Descriptive within-cohort ranking by observed rate difference, only after both group thresholds pass. Null otherwise."
  measures:
    sample_size:
      expr: _.sample_size.sum()
      description: With-card player-result observations; filter one card and compatible cohorts.
    # Bracket access keeps these as Ibis count expressions; BSL 0.3.7 cannot
    # hash nullif post-operations on its inferred calculated-measure nodes.
    avg_win_rate_with_card:
      expr: _["wins_with_card"].sum() * 100.0 / _["sample_size"].sum().nullif(0)
      description: Pooled wins with card / card-match observations, percentage (0-100); ties count as non-wins. Null with no observations.
    avg_win_rate_without_card:
      expr: _["wins_without_card"].sum() * 100.0 / _["matches_without_card"].sum().nullif(0)
      description: Pooled wins without card / without-card observations, percentage (0-100); ties count as non-wins. Null with no observations.
    avg_relevance_score:
      expr: (_["wins_with_card"].sum() * 100.0 / _["sample_size"].sum().nullif(0)) - (_["wins_without_card"].sum() * 100.0 / _["matches_without_card"].sum().nullif(0))
      description: Observed difference of pooled win percentages, in percentage points; not a causal effect. Null without both groups. Filter compatible game/format/period cohorts.
    avg_suggested_quantity:
      expr: _["quantity_in_wins"].sum() * 1.0 / _["wins_with_card"].sum().nullif(0)
      description: Descriptive copies from observed lists, weighted once per recorded win; not an optimized prescription. Null with no wins.
    matches_without_card:
      expr: _["matches_without_card"].sum()
      description: "Without-card player-result observations; filter one card and compatible cohorts."
    decks_with_card:
      expr: _["decks_with_card"].sum()
      description: "With-card tournament-entry observations; filter one card, matchup and cohort. Repeated people across events are not resolved."
    decks_without_card:
      expr: _["decks_without_card"].sum()
      description: "Without-card tournament-entry observations; filter one card, matchup and cohort."
    wins_with_card:
      expr: _["wins_with_card"].sum()
      description: "Observed wins in the with-card comparison group."
    losses_with_card:
      expr: _["losses_with_card"].sum()
      description: "Observed losses in the with-card comparison group."
    ties_with_card:
      expr: _["ties_with_card"].sum()
      description: "Observed draws in the with-card comparison group."
    wins_without_card:
      expr: _["wins_without_card"].sum()
      description: "Observed wins in the without-card comparison group."
    losses_without_card:
      expr: _["losses_without_card"].sum()
      description: "Observed losses in the without-card comparison group."
    ties_without_card:
      expr: _["ties_without_card"].sum()
      description: "Observed draws in the without-card comparison group."
    recorded_match_count:
      expr: _["recorded_match_count"].sum()
      description: "Valid classified player-results before own-decklist availability filtering; repeated across cards, so filter one card."
    matches_with_decklists:
      expr: _["matches_with_decklists"].sum()
      description: "Valid classified results with published own-card rows; repeated across cards, so filter one card."
tournament_analysis:
  table: mart_tournament_analysis
  database: main_consumption
  description: Tournament-level summaries, player counts, match activity, and set/meta period. Use this to understand data
    coverage and recent tournament activity.
  dimensions:
    source:
      expr: _.source
      description: 'Data provider: limitless_play, limitless_labs, or unknown.'
    event_type:
      expr: _.event_type
      description: 'Event setting: online, in_person, or unknown. Independent of data provider.'
    tournament_id:
      expr: _.tournament_id
      description: Unique tournament identifier.
    tournament_name:
      expr: _.tournament_name
      description: Tournament name.
    tournament_date:
      expr: _.tournament_date
      description: Tournament date.
    format:
      expr: _.format
      description: Tournament format.
    winner_name:
      expr: _.winner_name
      description: Tournament winner.
    set_name:
      expr: _.set_name
      description: The set or meta period assigned to the tournament.
  measures:
    player_count:
      expr: _.player_count.sum()
      description: Number of players in the tournament.
    total_matches:
      expr: _.total_matches.sum()
      description: Deprecated alias for perspective_record_count; counts player records, including byes and unresolved records, not unique matches.
    perspective_record_count:
      expr: _.perspective_record_count.sum()
      description: Number of staged player-result records, including byes and unresolved records.
    unique_match_count:
      expr: _.unique_match_count.sum()
      description: Observed unique played pairings with known players and rounds; excludes byes and unresolved pairings. Not a completeness guarantee.
    mirrored_match_count:
      expr: _.mirrored_match_count.sum()
      description: Unique played pairings with histories for both players.
    one_sided_match_count:
      expr: _.one_sided_match_count.sum()
      description: Unique played pairings with history for only one of the two known players.
    bye_record_count:
      expr: _.bye_record_count.sum()
      description: Player records explicitly marked BYE; excluded from unique played matches.
    unresolved_perspective_record_count:
      expr: _.unresolved_perspective_record_count.sum()
      description: Player records without a reliable played-match identity; inspect tournament_matches.resolution_reason.
    duplicate_perspective_record_count:
      expr: _.duplicate_perspective_record_count.sum()
      description: Extra records for the same player within a reconciled group, including normalized-round duplicates.
    conflicting_outcome_match_count:
      expr: _.conflicting_outcome_match_count.sum()
      description: Identified played pairings with contradictory outcomes. Included in unique_match_count; original outcomes are preserved.
    incomplete_outcome_match_count:
      expr: _.incomplete_outcome_match_count.sum()
      description: Identified played pairings with at least one missing or unrecognized outcome. Included in unique_match_count.
deck_analysis:
  table: mart_deck_analysis
  database: main_consumption
  description: Participant-level tournament performance. Use this to identify high-performing players and decklists.
  dimensions:
    source:
      expr: _.source
      description: Tournament data provider.
    event_type:
      expr: _.event_type
      description: 'Tournament setting: online, in_person, or unknown.'
    set_name:
      expr: _.set_name
      description: The set or meta period.
    player_name:
      expr: _.player_name
      description: Player name.
    tournament_url:
      expr: _.tournament_url
      description: Link to the tournament standings or decklist context.
  measures:
    total_matches:
      expr: _.total_matches.sum()
      description: Total matches played by the player in the tournament.
    total_wins:
      expr: _.wins.sum()
      description: Player wins.
    total_losses:
      expr: _.losses.sum()
      description: Player losses.
    total_ties:
      expr: _.ties.sum()
      description: Player ties.
    avg_win_rate:
      expr: _.wins.sum() * 100.0 / _.total_matches.sum().nullif(0)
      description: Pooled wins / recorded player-results, as a percentage (0-100); ties stay in the denominator. Null with no results.
cards:
  table: dim_cards
  database: main_semantic
  description: Dimension table containing unique card information.
  dimensions:
    card_id:
      expr: _.card_id
      description: Unique identifier for the card.
    card_name:
      expr: _.card_name
      description: Name of the card.
    card_code:
      expr: _.card_code
      description: Set code and number.
    card_kind:
      expr: _.card_kind
      description: 'Type of card: pokemon, trainer, or energy.'
matches:
  table: fct_matches
  database: main_semantic
  description: Player-perspective result records. Preserve these for player/archetype statistics; use tournament_matches for unique played pairings.
  dimensions:
    match_id:
      expr: _.match_id
      description: Identifier for a player/event/raw-round record, not a unique played match.
    participant_id:
      expr: _.participant_id
      description: Primary player participant identifier.
    opponent_id:
      expr: _.opponent_id
      description: Opponent participant identifier when available.
    tournament_id:
      expr: _.tournament_id
      description: Tournament identifier.
    result:
      expr: _.result
      description: 'Match outcome: WIN, LOSS, or TIE.'
    opponent_name:
      expr: _.opponent_name
      description: Name of the opponent player.
    round:
      expr: _.round
      description: Tournament round number.
  measures:
    perspective_record_count:
      expr: _.count()
      description: Player-perspective record count, including byes and unresolved records.
    match_count:
      expr: _.count()
      description: Compatibility alias for perspective_record_count; includes byes and unresolved records, not unique played matches.
monthly_populations:
  table: mart_monthly_populations
  database: main_consumption
  description: Population totals at one row per month/provider/setting, including unclassified entries. Use instead of summing
    repeated archetype denominators.
  dimensions:
    tournament_month:
      expr: _.tournament_month
    source:
      expr: _.source
    event_type:
      expr: _.event_type
  measures:
    total_participants:
      expr: _.total_participants.sum()
      description: Tournament entries, counted once per cohort; not distinct people across events.
archetype_deck_populations:
  table: mart_archetype_deck_populations
  database: main_consumption
  description: Published classified deck populations at one row per set/provider/setting/archetype. Use instead of summing
    denominators repeated for every card.
  dimensions:
    set_name:
      expr: _.set_name
    source:
      expr: _.source
    event_type:
      expr: _.event_type
    archetype:
      expr: _.archetype
  measures:
    total_archetype_decks:
      expr: _.total_archetype_decks.sum()
      description: Published classified tournament decks, counted once per cohort.

tournament_matches:
  table: fct_tournament_matches
  database: main_semantic
  description: Reconciled observed pairings and unresolved record groups. Filter resolution_reason to resolved for played matches; byes are not played matches. Source coverage may be incomplete.
  dimensions:
    match_group_id:
      expr: _.match_group_id
      description: Stable reconciliation group ID, including fallback groups for unresolved records and byes.
    canonical_match_id:
      expr: _.canonical_match_id
      description: Event/normalized-round/unordered-player-pair identity; null for byes or unresolved pairings.
    tournament_id:
      expr: _.tournament_id
    round_key:
      expr: _.round_key
      description: Normalized round, retaining named phase labels.
    player_low_id:
      expr: _.player_low_id
    player_high_id:
      expr: _.player_high_id
    resolution_reason:
      expr: _.resolution_reason
      description: resolved, bye, missing_round, unknown_player, unknown_opponent, self_pairing, or conflicting_pairing.
    history_status:
      expr: _.history_status
      description: mirrored, one_sided, bye, or unresolved.
    outcome_status:
      expr: _.outcome_status
      description: consistent, double_loss, one_sided, conflicting, incomplete, unresolved, or not_applicable. Contradictions never rewrite player results.
    low_player_result:
      expr: _.low_player_result
    high_player_result:
      expr: _.high_player_result
  measures:
    unique_match_count:
      expr: _.canonical_match_id.count()
      description: Observed identified played pairings; excludes byes/unresolved groups. Includes pairings with flagged outcome problems.
    perspective_record_count:
      expr: _.perspective_record_count.sum()
      description: Contributing player records, including duplicates, byes, and unresolved records.
    duplicate_perspective_record_count:
      expr: _.duplicate_perspective_record_count.sum()
      description: Extra player records within a reconciliation group.
