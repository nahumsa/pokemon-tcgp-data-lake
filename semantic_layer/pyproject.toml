[project]
name = "pokemon-tcg-semantic-layer"
version = "0.1.0"
description = "Semantic layer and MCP server for Pokemon TCG"
requires-python = ">=3.12"
dependencies = [
    "boring-semantic-layer[mcp]>=0.3.7",
    "mcp>=1.26.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["semantic_layer"]
package-dir = {"" = "."}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
semantic_layer = ["boring.yml"]
